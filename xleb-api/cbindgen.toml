language = "C"
include_guard = "XLEB_API_H"
autogen_warning = "/* This file is autogenerated by cbindgen. Do not edit. */"
header = "/* SPDX-License-Identifier: MIT */\n/* SPDX-FileCopyrightText: 2026 XundrerAlt */"
pragma_once = true
include_version = false
sys_includes = ["stdint.h"]
no_includes = true
cpp_compat = false
documentation = true
documentation_style = "doxy"
tab_width = 4
style = "both"

[export]
prefix = "XLEB_"
include = ["BootInfo", "MemoryMapInfo", "ModuleInfo", "ModuleEntry", "KernelInfo", "CapType", "SyscallNum", "SyscallErrno", "BOOTINFO_MAGIC", "BOOTINFO_VERSION", "BOOTINFO_ADDR", "MAX_MEMORY_REGIONS", "MAX_MODULES"]

[export.rename]
"BootInfo" = "bootinfo_t"
"MemoryMapInfo" = "memory_map_info_t"
"ModuleInfo" = "module_info_t"
"ModuleEntry" = "module_entry_t"
"KernelInfo" = "kernel_info_t"
"CapType" = "cap"
"SyscallNum" = "syscall_num_t"
"SyscallErrno" = "errno_t"

[enum]
prefix_with_name = false
rename_variants = "ScreamingSnakeCase"

[const]
allow_static_const = false
allow_constexpr = true
